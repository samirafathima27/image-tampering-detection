<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Image Authenticity Checker</title>
  <style>
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
      margin: 0;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 8px;
    }
    p {
      font-size: 12.5px;
      color: #555;
      line-height: 1.4;
    }
    .upload-btn {
      display: block;
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      background: #1a1a2e;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }
    #result {
      margin-top: 12px;
      font-size: 12.5px;
    }
  </style>
</head>
<body>
  <h1>Image Authenticity Checker</h1>
  <p>Right-click any image on a webpage and select "Check Image Authenticity" — or upload one here directly.</p>
  <input type="file" id="fileInput" accept="image/*" style="display:none" />
  <button class="upload-btn" id="uploadBtn">Upload an image to check</button>
  <div id="result"></div>
  <script src="popup.js"></script>
</body>
</html>
